<!doctype html><html lang="en"><meta charset="utf-8"><title>Social Motion Agent · editorial loop</title><style>body{margin:0;background:#eeeae2}canvas{display:block;width:100%;height:auto}</style><canvas width="960" height="540"></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');
const ease=v=>{v=Math.max(0,Math.min(1,v));return 1-(1-v)**3};
function text(s,a,b,size=24,color='#202725'){x.fillStyle=color;x.font=`500 ${size}px "DejaVu Sans", sans-serif`;x.fillText(s,a,b)}
function box(a,b,w,h,col,r=10){x.fillStyle=col;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
window.seek=function(t){
 t=((t%8)+8)%8; x.fillStyle='#eeeae2';x.fillRect(0,0,960,540);
 text('SOCIAL MOTION AGENT',48,50,16);text('CREATIVE WORKFLOW / 01',695,50,13,'#68706a');
 const phase=t<2.5?0:t<5?1:2, local=t-[0,2.5,5][phase];
 const titles=['Make the cut.','Give it motion.','Make it yours.'];
 const subtitles=['From raw ideas to a deliberate edit.','One visual system. Every frame connected.','Choose a style. Preview. Refine.'];
 text(titles[phase],48,142,66);text(subtitles[phase],51,181,20,'#68706a');
 const p=ease(local/1.3),accent='#dc593c';
 // The same three clips persist through cut, motion and refinement.
 for(let i=0;i<3;i++){
   const base=70+i*281;
   const y=phase===1?260-26*Math.sin(p*Math.PI+i*.8):260;
   x.save();x.translate(base+128,y+65);
   if(phase===1)x.rotate(Math.sin(p*Math.PI)*(.08-i*.07));
   if(phase===2){const scale=1+Math.sin(p*Math.PI)*.04;x.scale(scale,scale)}
   box(-128,-65,256,130,i===1?accent:i===0?'#202725':'#d2cfc5',14);
   const col=i===2?'#202725':'#eeeae2';
   if(i===0){text('Aa',-105,27,74,col);text('TYPE',64,45,12,col)}
   if(i===1){x.strokeStyle=col;x.lineWidth=3;for(let j=0;j<3;j++){x.beginPath();x.arc(0,0,18+j*15,(-.3+p*.4)*Math.PI,(1.3+p*.4)*Math.PI);x.stroke()}text('MOTION',57,45,12,col)}
   if(i===2){for(let j=0;j<5;j++)box(-94+j*38,-(15+Math.sin(j+p*4)*10),20,45+Math.sin(j+p*4)*20,'#202725',4);text('RHYTHM',48,52,12,col)}
   x.restore();
 }
 const play=phase===0?70+p*818:phase===1?70+(1-p)*818:70+p*818;
 x.strokeStyle=accent;x.lineWidth=2;x.beginPath();x.moveTo(play,244);x.lineTo(play,409);x.stroke();box(play-5,236,10,10,accent,2);
 for(let i=0;i<42;i++)box(70+i*20,429,1,i%5===0?10:5,'#a8aaa1',0);
 text(['01 / CUT','02 / ANIMATE','03 / REFINE'][phase],48,494,14);
 text('Your agent. Your direction.',654,494,18,'#68706a');
 // Return to the opening across the last 0.35 s for a quiet loop seam.
 if(t>7.65){x.fillStyle=`rgba(238,234,226,${ease((t-7.65)/.35)})`;x.fillRect(0,70,960,390)}
};window.seek(0);
</script></html>
