name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - run: npm ci --ignore-scripts
      - run: python -S -B -m unittest discover -s tests -v
      - run: python -S scripts/smoke_test.py
      - run: python -S scripts/release_check.py
      - run: python -S studio.py demo --render
        env:
          DO_NOT_TRACK: '1'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: render-evidence-python-${{ matrix.python }}
          path: |
            output/jobs/**/technical.json
            output/jobs/**/notes/hyperframes-*.log
            output/jobs/**/renders/*.mp4
          retention-days: 7
