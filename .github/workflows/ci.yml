name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: python -S -B -m unittest discover -s tests -v
      - run: python -S scripts/smoke_test.py
      - run: python -S scripts/release_check.py
      - run: python -S studio.py demo --render
        env:
          HYPERFRAMES_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-evidence-python-${{ matrix.python }}
          path: |
            output/jobs/**/technical.json
            output/jobs/**/notes/hyperframes-*.log
            output/jobs/**/renders/*.mp4
          retention-days: 7
