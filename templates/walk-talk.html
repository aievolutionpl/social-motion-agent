<!doctype html>
<html lang="@@LANG@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=@@WIDTH@@, height=@@HEIGHT@@">
<title>Kinetic Walk &amp; Talk</title>
<script src="./gsap.min.js"></script>
<style>
@font-face{font-family:WalkTalk;src:url('./media/walk-talk-font.ttf');font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:@@WIDTH@@px;height:@@HEIGHT@@px;overflow:hidden;background:#101010}
#root,#world{position:absolute;inset:0;overflow:hidden}#world{transform-origin:50% 55%}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clip{position:absolute;visibility:hidden;opacity:0;text-align:center;font-family:WalkTalk,Arial,sans-serif;white-space:pre-line;line-height:1.05}
.caption{left:7%;right:7%;top:54%;font-size:52px;font-weight:500;color:#fff;text-shadow:0 2px 8px #0009}
.accent{width:88%;font-weight:900;letter-spacing:-.035em;text-shadow:0 4px 0 #0002;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<main id="root" data-composition-id="main" data-start="0" data-duration="@@DURATION@@" data-width="@@WIDTH@@" data-height="@@HEIGHT@@" data-fps="@@FPS@@">
<div id="world">@@LAYERS@@</div>
</main>
<script>
const tl=gsap.timeline({paused:true});
tl.to({}, {duration:@@DURATION@@}, 0);
@@ANIMATION@@
const clips=[...document.querySelectorAll('.clip')];
function visibility(t){for(const el of clips){const a=Number(el.dataset.start),b=a+Number(el.dataset.duration);const on=t>=a&&t<b;el.style.visibility=on?'visible':'hidden';el.style.opacity=on?'1':'0';}}
tl.eventCallback('onUpdate',()=>visibility(tl.time()));
window.__timelines={main:tl};window.DURATION=@@DURATION@@;
window.seek=t=>{const time=Math.max(0,Math.min(Number(t)||0,window.DURATION));tl.seek(time,false);visibility(time);};
window.__ready=document.fonts.ready;
window.seek(0);
</script>
</body>
</html>
